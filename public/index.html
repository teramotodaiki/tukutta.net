<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tukutta.net — 作品置き場</title>
    <meta
      name="description"
      content="teramotoの作品置き場。サブドメインに色々置いてます。"
    />
    <meta name="theme-color" content="#0a0f1f" />
    <meta property="og:title" content="tukutta.net — 作品置き場" />
    <meta
      property="og:description"
      content="サブドメインに色々置いてます。ChatGPT風UI。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tukutta.net" />
    <style>
      /* ChatGPT (GPT‑5) 風の多層グラデーションを CSS で再現 */
      :root {
        --bg-deep: #0a0f1f;
        --fg-primary: #e8eefc;
        --fg-muted: #a8b0c7;
        --chip-bg: rgba(255, 255, 255, 0.08);
        --chip-bd: rgba(255, 255, 255, 0.18);
        --card-bg: rgba(10, 15, 31, 0.5);
        --card-bd: rgba(255, 255, 255, 0.12);
        --ring: rgba(136, 172, 255, 0.6);
        --link: #b9ccff;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", Meiryo, sans-serif;
        color: var(--fg-primary);
        background: var(--bg-deep);
        overflow-x: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: radial-gradient(
            60% 60% at 82% 18%,
            rgba(255, 136, 96, 0.35),
            rgba(255, 136, 96, 0) 55%
          ),
          radial-gradient(
            55% 55% at 18% 20%,
            rgba(150, 96, 255, 0.35),
            rgba(150, 96, 255, 0) 55%
          ),
          radial-gradient(
            50% 50% at 55% 70%,
            rgba(250, 220, 120, 0.18),
            rgba(250, 220, 120, 0) 60%
          ),
          radial-gradient(120% 100% at 50% 0%, #0b1430, var(--bg-deep));
        filter: saturate(1.05);
      }
      .bg::before {
        content: "";
        position: absolute;
        inset: -10vmax;
        z-index: -1;
        background: conic-gradient(
          from 180deg at 60% 40%,
          rgba(255, 180, 120, 0.12),
          rgba(120, 160, 255, 0.08),
          rgba(255, 120, 200, 0.1),
          rgba(255, 180, 120, 0.12)
        );
        filter: blur(80px) contrast(1.05);
        opacity: 0.9;
      }
      .grain {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        mix-blend-mode: overlay;
        opacity: 0.25;
      }
      .grain::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: repeating-radial-gradient(
            circle at 10% 10%,
            rgba(255, 255, 255, 0.02) 0 1px,
            transparent 1px 2px
          ),
          repeating-linear-gradient(
            45deg,
            rgba(0, 0, 0, 0.05) 0 2px,
            transparent 2px 4px
          );
        filter: blur(0.3px);
      }

      .wrap {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 1.1rem;
      }
      header .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #6ee7ff;
        box-shadow: 0 0 12px rgba(110, 231, 255, 0.9);
      }
      header .brand {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      header nav {
        margin-left: auto;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .nav-btn {
        background: transparent;
        color: var(--fg-muted);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 0.45rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }
      .nav-btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: var(--fg-primary);
      }

      .hero {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 8svh 1rem 2rem;
      }
      .title {
        font-size: clamp(1.35rem, 2.3vw, 2rem);
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .subtitle {
        color: var(--fg-muted);
        margin-top: 0.5rem;
        font-size: 0.95rem;
      }

      .search {
        max-width: 760px;
        width: min(92vw, 760px);
        margin: 1.5rem auto 0;
        position: relative;
      }
      .search .bar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        width: 100%;
        background: rgba(15, 20, 40, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 0.85rem 1rem;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      }
      .icon {
        width: 1.1rem;
        height: 1.1rem;
        opacity: 0.8;
      }
      .input {
        flex: 1;
        background: transparent;
        border: 0;
        color: var(--fg-primary);
        font-size: 0.98rem;
        outline: none;
      }
      .kbd {
        font-size: 0.75rem;
        color: var(--fg-muted);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 0.2rem 0.45rem;
        border-radius: 0.4rem;
      }

      .chips {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
        margin: 0.9rem auto 0;
        max-width: 760px;
      }
      .chip {
        border: 1px solid var(--chip-bd);
        background: var(--chip-bg);
        padding: 0.35rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        color: var(--fg-muted);
        cursor: pointer;
      }
      .chip.active {
        color: #eaf0ff;
        border-color: var(--ring);
        box-shadow: 0 0 0 3px rgba(136, 172, 255, 0.2) inset;
      }

      .section {
        max-width: 1120px;
        width: min(92vw, 1120px);
        margin: 2.2rem auto 5rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }
      .card {
        position: relative;
        border: 1px solid var(--card-bd);
        background: var(--card-bg);
        border-radius: 16px;
        padding: 16px;
        backdrop-filter: blur(6px);
        transition: transform 0.2s ease, border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: rgba(185, 204, 255, 0.45);
        box-shadow: 0 10px 30px rgba(24, 40, 80, 0.35);
      }
      .card h3 {
        margin: 0 0 0.4rem;
        font-size: 1rem;
      }
      .card p {
        margin: 0.2rem 0 0.8rem;
        color: var(--fg-muted);
        font-size: 0.9rem;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 0.25rem 0.5rem;
        border-radius: 999px;
        font-size: 0.72rem;
        color: #d7def2;
      }
      .extern {
        margin-left: auto;
        opacity: 0.7;
      }

      footer {
        color: var(--fg-muted);
        font-size: 0.85rem;
        text-align: center;
        padding: 1.2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0) 0,
          rgba(0, 0, 0, 0.25) 100%
        );
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 420px) {
        header {
          padding: 0.75rem 0.8rem;
        }
        .search .bar {
          padding: 0.75rem 0.9rem;
        }
        .subtitle {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="wrap">
      <header>
        <span class="dot" aria-hidden="true"></span>
        <div class="brand">tukutta.net</div>
        <nav>
          <a
            class="nav-btn"
            href="https://github.com/teramotodaiki"
            target="_blank"
            rel="noreferrer"
            >GitHub</a
          >
        </nav>
      </header>

      <main>
        <section class="hero">
          <h1 class="title">GPT‑5風ポートフォリオ</h1>
          <p class="subtitle">
            作ったものを置いておくドメイン。サブドメインに色々あります。
          </p>

          <div class="search">
            <div class="bar">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M12 5v14M5 12h14"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <input
                id="q"
                class="input"
                type="text"
                placeholder="作品を検索…  / でフォーカス"
                autocomplete="off"
              />
              <span class="kbd">/</span>
            </div>
          </div>

          <div
            id="chips"
            class="chips"
            role="listbox"
            aria-label="タグで絞り込み"
          ></div>
        </section>

        <section class="section">
          <div id="grid" class="grid" aria-live="polite"></div>
        </section>
      </main>

      <footer>
        <span
          >© <span id="yy"></span> tukutta.net · 最小限のプロフィール: teramoto
          — TypeScript & 生成AI。</span
        >
      </footer>
    </div>

    <script>
      // ===== 設定 =====
      const BASE = "tukutta.net";
      const PROJECTS = [
        {
          title: "Quoridor",
          url: `https://quoridor.${BASE}/`,
          desc: "コリドール。オンライン対戦。",
          tags: ["game", "online"],
          featured: true,
          repo: "https://github.com/teramotodaiki/quoridor",
        },
        {
          title: "Kanji-English Blend",
          url: `https://kanji-english-blend.${BASE}/`,
          desc: "漢字-English Blend。日本人と中国人に通じる文章を生成。",
          tags: ["lang", "text"],
          repo: "https://github.com/teramotodaiki/kanji-english-blend",
        },
        {
          title: "Devin Diary",
          url: `https://devin-diary.${BASE}/`,
          desc: "Devinの日記。AIエンジニアDevinが書いた日記。",
          tags: ["ai", "text"],
        },
      ];

      // ===== ロジック =====
      const state = { q: "", tag: "all" };
      const yy = document.getElementById("yy");
      yy.textContent = new Date().getFullYear();

      const chips = document.getElementById("chips");
      const grid = document.getElementById("grid");
      const q = document.getElementById("q");

      const tags = Array.from(new Set(PROJECTS.flatMap((p) => p.tags))).sort();
      tags.unshift("all");

      function chipEl(name) {
        const el = document.createElement("button");
        el.className = "chip" + (state.tag === name ? " active" : "");
        el.textContent = name;
        el.onclick = () => {
          state.tag = name;
          render();
        };
        return el;
      }

      function projectCard(p) {
        const a = document.createElement("a");
        a.href = p.url;
        a.className = "card";
        a.target = "_blank";
        a.rel = "noreferrer";
        a.innerHTML = `
        <div style="display:flex; align-items:center; gap:.6rem;">
          <div class="pill"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v10M7 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> ${
            new URL(p.url).host.split(".")[0]
          }</div>
          <svg class="icon extern" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 5h5v5M10 14l9-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M19 14v5H5V5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.desc || "")}</p>
        <div style="display:flex; gap:.35rem; flex-wrap:wrap;">
          ${(p.tags || [])
            .map((t) => `<span class="pill">${t}</span>`)
            .join("")}
          ${
            p.repo
              ? `<a class="pill" href="${p.repo}" target="_blank" rel="noreferrer">GitHub</a>`
              : ""
          }
        </div>
      `;
        return a;
      }

      function render() {
        chips.replaceChildren(...tags.map(chipEl));
        const qn = state.q.trim().toLowerCase();
        const list = PROJECTS.slice().sort(
          (a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0)
        );
        const filtered = list.filter(
          (p) =>
            (state.tag === "all" || p.tags?.includes(state.tag)) &&
            (qn === "" ||
              [p.title, p.desc, p.url].join(" ").toLowerCase().includes(qn))
        );
        grid.replaceChildren(...filtered.map(projectCard));
      }

      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (s) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[s])
        );
      }

      // 入力 & キーボード
      q.addEventListener("input", (e) => {
        state.q = e.target.value;
        render();
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== q) {
          e.preventDefault();
          q.focus();
        }
        if (e.key === "Escape") {
          q.blur();
        }
        if (e.key === "Enter" && document.activeElement === q) {
          const first = grid.querySelector(".card");
          if (first) first.click();
        }
      });

      // ===== 最小テスト =====
      function runTests() {
        try {
          console.group("%ctukutta.net smoke tests", "font-weight:bold");
          // 1) 初期レンダ: 全カード出る
          render();
          console.assert(
            document.querySelectorAll(".card").length === PROJECTS.length,
            "初期カード数が一致しない"
          );
          // 2) クエリフィルタ
          state.q = "quoridor";
          render();
          console.assert(
            document.querySelectorAll(".card").length === 1,
            "検索フィルタが効いていない"
          );
          state.q = "";
          render();
          // 3) タグが'all'含む
          console.assert(
            Array.from(chips.children).some((n) => n.textContent === "all"),
            "all タグが無い"
          );
          // 4) 余計なグローバルが無い（旧コードのmsgなど）
          console.assert(
            typeof msg === "undefined",
            "不要なグローバル msg が存在"
          );
          console.groupEnd();
        } catch (e) {
          console.error("テスト失敗", e);
        }
      }
      runTests();
    </script>
  </body>
</html>
